# --- MAPPO_NS specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

buffer_size: 10
batch_size_run: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 200

lr: 0.0003

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "rnn_ns"
agent_output_type: "pi_logits"
learner: "ppo_learner"
entropy_coef: 0.01
use_rnn: False
standardise_returns: False
standardise_rewards: True
q_nstep: 5 # 1 corresponds to normal r + gammaV
critic_type: "cv_critic_ns"
epochs: 4
eps_clip: 0.2
name: "mappo_graph_ns"

t_max: 20050000



k: 3
density: null
use_knn_graph: False
use_full_path: True
graph_skip_ts: 1
# env_args:
#   use_targeter_graph: False

latten_state_dim: 64
state_hidden_dim: 64
world_model_buffer_size: 10
world_model_batch_size: 10
revs_model_hidden_dim: 128

use_er_graph: False  #  erdos_renyi_graph
p: 0.3